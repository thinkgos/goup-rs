# lefthook

pre-commit:
  jobs:
    - name: code style format
      glob: "*.rs"
      run: cargo fmt -- --check
    - name: lint
      glob: "*.rs"
      group:
        jobs:
          - run: cargo clippy --all-targets --all-features -- -D warnings
          - run: cargo check
    - name: tests
      glob: "*.rs"
      run: cargo test --all-features
